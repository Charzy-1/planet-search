<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="/style.css">
  <title>Planet search</title>
</head>
<body>
  
  <h1>Explore the Solar System</h1>

  <div class="search-row">
    <input id="js-planet-input" type="text" placeholder="Type a planet name (e.g. Earth)">
    <button id="js-search-btn">Search</button>
  </div>

  <div id="js-result">
    <p class="message">Search for a planet to see the details</p>
  </div>
  

  <script src="/index.js"></script>
</body>
</html>
